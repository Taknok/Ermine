name: Fdroid Build Ermine


on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      app:
        type: string
        default: "com.deeperwire.ermine"
      version:
        required: true
        type: string


jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/ironfox-oss/ironfox:latest
    timeout-minutes: 420
    env:
      APP: ${{ inputs.app }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          depth: 0
          repository: ironfox-oss/IronFox

      - name: Get sources
        run: |
          ./scripts/get_sources.sh

      - name: Prebuilt
        run: |
          ./scripts/prebuild.sh

      - name: Build
        run: |
          ./scripts/build.sh arm64
